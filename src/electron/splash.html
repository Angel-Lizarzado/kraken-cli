<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kraken CLI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

    :root {
      --bg: #141313;
      --text-main: #e5e2e1;
      --text-muted: #919094;
      --accent: #c0c1ff;
      --border: #353434;
    }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      opacity: 0;
      animation: containerIn 0.5s ease-out forwards;
      width: 100%;
      padding: 0 40px;
    }

    /* ── Logo ── */
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      /* Eliminamos el gradiente neon volviéndolo escala de grises con contraste industrial */
      filter: grayscale(100%) contrast(1.2) brightness(1.5);
      opacity: 0;
      transform: translateY(-10px);
      animation: dropIn 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ── Text Stack ── */
    .text-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .app-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-main);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.4s 0.4s ease-out forwards;
    }

    .app-tagline {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      animation: fadeIn 0.4s 0.5s ease-out forwards;
    }

    /* ── Progress Terminal-style ── */
    .terminal-progress {
      width: 100%;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      animation: fadeIn 0.4s 0.6s ease-out forwards;
    }

    .progress-track {
      width: 100%;
      height: 2px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--accent);
      width: 0%;
      animation: loadProgress 2.2s 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .status-text {
      font-size: 10px;
      font-weight: 400;
      color: var(--accent);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .status-text .cursor {
      display: inline-block;
      width: 6px;
      height: 12px;
      background: var(--accent);
      animation: blink 1s step-end infinite;
      margin-left: 6px;
    }

    /* ── Version badge ── */
    .version {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeIn 0.4s 1s ease-out forwards;
    }

    /* ── Keyframes ── */
    @keyframes containerIn {
      to { opacity: 1; }
    }

    @keyframes dropIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      20% { width: 15%; }
      50% { width: 65%; }
      80% { width: 85%; }
      100% { width: 100%; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        transition-duration: 0s !important;
      }
      .logo-img, .app-name, .app-tagline, .terminal-progress, .version {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="splash">
    <img class="logo-img" id="logoImg" src="../../assets/icon.png" alt="Kraken CLI" />

    <div class="text-stack">
      <div class="app-name">Kraken CLI</div>
      <div class="app-tagline">Centro de control</div>
    </div>

    <div class="terminal-progress">
      <div class="status-text">
        <span>> <span id="status">INICIALIZANDO...</span></span><span class="cursor"></span>
      </div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <div class="version" id="versionBadge"></div>

  <script>
    // Leer parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const version = urlParams.get('v');
    const iconPath = urlParams.get('icon');

    if (version) {
      document.getElementById('versionBadge').textContent = 'v' + version;
    }
    
    if (iconPath) {
      document.getElementById('logoImg').src = iconPath;
    }

    const messages = [
      'CONECTANDO MÓDULOS',
      'CARGANDO CONFIGURACIÓN',
      'PREPARANDO INTERFAZ'
    ];
    let i = 0;
    const el = document.getElementById('status');
    const interval = setInterval(() => {
      if (i >= messages.length) { clearInterval(interval); return; }
      el.style.opacity = '0';
      setTimeout(() => {
        el.textContent = messages[i++];
        el.style.opacity = '1';
      }, 100);
    }, 750);
  </script>
</body>

</html>
