<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kraken CLI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      --surface-base: oklch(0.14 0.008 250);
      --surface-raised: oklch(0.18 0.01 250);
      --surface-overlay: oklch(0.22 0.012 250);
      --text-primary: oklch(0.92 0.005 250);
      --text-secondary: oklch(0.65 0.01 250);
      --text-muted: oklch(0.42 0.01 250);
      --accent: oklch(0.6 0.15 250);
      --accent-dim: oklch(0.35 0.08 250 / 0.2);
      --border: oklch(0.25 0.012 250);
    }

    body {
      background: var(--surface-base);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      opacity: 0;
      animation: containerIn 0.5s 0.1s ease-out forwards;
    }

    /* ── Logo Container ── */
    .logo-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
    }

    .logo-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.8);
      animation: logoReveal 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 0 20px oklch(0.5 0.12 250 / 0.3));
    }

    /* Orbital ring — subtle rotating accent */
    .orbit {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--accent);
      border-right-color: oklch(0.5 0.1 250 / 0.3);
      opacity: 0;
      animation:
        orbitIn 0.4s 0.5s ease-out forwards,
        orbitSpin 2.4s 0.5s linear infinite;
    }

    /* ── Text Stack ── */
    .text-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .app-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0;
      transform: translateY(6px);
      animation: slideUp 0.4s 0.4s ease-out forwards;
    }

    .app-tagline {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(6px);
      animation: slideUp 0.4s 0.55s ease-out forwards;
    }

    /* ── Progress ── */
    .progress-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(6px);
      animation: slideUp 0.4s 0.65s ease-out forwards;
    }

    .progress-track {
      width: 180px;
      height: 2px;
      background: var(--surface-overlay);
      border-radius: 1px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 1px;
      animation: loadProgress 2.2s 0.8s ease-in-out forwards;
    }

    .status-text {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      transition: opacity 150ms ease-out;
    }

    /* ── Version badge ── */
    .version {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      opacity: 0;
      animation: fadeIn 0.4s 1s ease-out forwards;
    }

    /* ── Ambient glow (very subtle, not glassmorphism) ── */
    .ambient {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 280px;
      height: 280px;
      transform: translate(-50%, -55%);
      background: radial-gradient(circle, oklch(0.4 0.1 250 / 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Keyframes ── */
    @keyframes containerIn {
      to {
        opacity: 1;
      }
    }

    @keyframes logoReveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes orbitIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes orbitSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes loadProgress {
      0% {
        width: 0%;
      }

      40% {
        width: 45%;
      }

      70% {
        width: 70%;
      }

      100% {
        width: 88%;
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        transition-duration: 0s !important;
      }

      .logo-img {
        opacity: 1;
        transform: scale(1);
      }

      .orbit {
        opacity: 1;
      }

      .splash {
        opacity: 1;
      }

      .app-name,
      .app-tagline,
      .progress-container,
      .version {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="ambient"></div>
  <div class="splash">
    <div class="logo-wrapper">
      <img class="logo-img" id="logoImg" src="../../assets/icon.png" alt="Kraken CLI" />
      <div class="orbit"></div>
    </div>

    <div class="text-stack">
      <div class="app-name">Kraken CLI</div>
      <div class="app-tagline">Centro de control</div>
    </div>

    <div class="progress-container">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="status-text" id="status">Inicializando servicios…</div>
    </div>
  </div>

  <div class="version" id="versionBadge"></div>

  <script>
    // Leer parámetros de URL
    const urlParams = new URLSearchParams(window.location.search);
    const version = urlParams.get('v');
    const iconPath = urlParams.get('icon');

    if (version) {
      document.getElementById('versionBadge').textContent = 'v' + version;
    }
    
    if (iconPath) {
      document.getElementById('logoImg').src = iconPath;
    }

    const messages = [
      'Conectando módulos…',
      'Cargando configuración…',
      'Preparando interfaz…'
    ];
    let i = 0;
    const el = document.getElementById('status');
    const interval = setInterval(() => {
      if (i >= messages.length) { clearInterval(interval); return; }
      el.style.opacity = '0';
      setTimeout(() => {
        el.textContent = messages[i++];
        el.style.opacity = '1';
      }, 150);
    }, 800);
  </script>
</body>

</html>
