<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando Clinmedia Ops...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body {
    background: oklch(0.16 0.008 260);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    user-select: none;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  .logo-ring {
    position: relative;
    width: 80px;
    height: 80px;
  }
  .logo-ring svg {
    width: 100%;
    height: 100%;
    animation: logoEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: scale(0.6);
  }
  .spinner-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid oklch(0.25 0.01 260);
    animation: spin 1.2s linear infinite;
  }
  .spinner-ring::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: oklch(0.52 0.16 250);
    animation: spin 0.8s linear infinite;
  }
  .title {
    color: oklch(0.92 0.005 260);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: fadeUp 0.6s 0.3s ease-out forwards;
  }
  .subtitle {
    color: oklch(0.45 0.008 260);
    font-size: 12px;
    font-weight: 400;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s ease-out forwards;
  }
  .progress-track {
    width: 160px;
    height: 3px;
    background: oklch(0.22 0.01 260);
    border-radius: 2px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.6s 0.7s ease-out forwards;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: oklch(0.52 0.16 250);
    border-radius: 2px;
    animation: progressLoad 2s 0.8s ease-in-out forwards;
  }
  .status {
    color: oklch(0.5 0.01 260);
    font-size: 11px;
    opacity: 0;
    animation: fadeUp 0.6s 0.9s ease-out forwards;
  }

  @keyframes logoEnter {
    from { opacity: 0; transform: scale(0.6) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes progressLoad {
    0% { width: 0%; }
    60% { width: 65%; }
    100% { width: 85%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-ring">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.16 250)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
      <rect x="6" y="6" width="12" height="8" rx="1" fill="oklch(0.52 0.16 250 / 0.15)" stroke="oklch(0.52 0.16 250)"/>
      <circle cx="9" cy="10" r="1.5" fill="oklch(0.6 0.18 150)"/>
      <circle cx="15" cy="10" r="1.5" fill="oklch(0.45 0.008 260)"/>
    </svg>
    <div class="spinner-ring"></div>
  </div>
  <div class="title">Clinmedia Ops</div>
  <div class="subtitle">Centro de control de migraciones</div>
  <div class="progress-track"><div class="progress-fill"></div></div>
  <div class="status">Inicializando servicios...</div>
</div>
</body>
</html>
